help:
  lines:
    - "&e/vip&7 - purchase website / open VIP menu"
    - "&e/vip help&7 - help command"
    - "&e/vip announcement <text with #colors#>&7 - send an announcement to all players &d(VIP+)&7 &o(once per 15 minutes)"
    - "&e/vip addFriend <java/bedrock> <name>&7 - add a friend to the whitelist &d(VIP+)&7 &o(max 3 friends every 7 days)"
    - "&e/vip rename <text with #colors#>&7 - rename the item in your hand &d(VIP+)"
    - "&e/vip nick_color <color>&7 - set your nametag color"
    - "&e/vip chatcolor <#color#|off>&7 - set your default chat message color"
    - "&e/vip kit&7 - VIP+ kit once every 4 days"
    - "&e/vip pet <pet name>&7 - enable a pet"
    - "&e/vip pet off&7 - disable your pet"
    - "&e/vip prefix <text with #colors#>&7 - nametag prefix &o(you can use colors like #blue# #red# #green#)"
    - "&e/vip suffix <text with #colors#>&7 - nametag suffix &o(you can use colors like #blue# #red# #green#)"
    - "&e/vip prefix off&7 - disable your nametag prefix"
    - "&e/vip suffix off&7 - disable your nametag suffix"
    - "&e/vip craft&7 - open crafting table"
    - "&e/vip ender_chest&7 - open ender chest"
    - "&e/vip particles <animation name>&7 - enable particles"
    - "&e/vip particles off&7 - disable particles"
    - "&e/vip join_message <text with #colors#>&7 - change your custom join message"
    - "&e/vip join_message off&7 - disable your custom join message"
    - "&e/vip leave_message <text with #colors#>&7 - change your custom leave message"
    - "&e/vip leave_message off&7 - disable your custom leave message"
    - "&e/vip kit&7 - claim VIP+ kit (only for VIP+ once every 4 days)"
    - "&7VIP and VIP+ players can put any item on their head &o(in the helmet slot)"
    - "&7VIP+ players can craft invisible light"
    - "&7VIP players can use color tags in chat: &0#black#&7, &1#dark_blue#&7, &2#dark_green#&7, &3#dark_aqua#&7, &4#dark_red#&7, &5#dark_purple#&7, &6#gold#&7, &7#gray#&7, &8#dark_gray#&7, &9#blue#&7, &a#green#&7, &b#aqua#&7, &c#red#&7, &d#light_purple#&7, &e#yellow#&7, &f#white#&7."
    - "&7Format tags: &l#bold#&r&7, &o#italic#&r&7, &n#underline#&r&7, &m#strikethrough#&r&7, #magic#, #reset# and any HEX color, for example #00aaff# &o(HEX colors can be found online or at https://htmlcolorcodes.com)"

