help:
  lines:
    - "&e/vip&7 - сайт покупки / відкрити VIP меню"
    - "&e/vip help&7 - підказки"
    - "&e/vip announcement <текст з #кольорами#>&7 - зробити оголошення для всіх гравців &d(VIP+)&7 &o(1 раз на 15 хвилин)"
    - "&e/vip addFriend <java/bedrock> <name>&7 - додати друга у білий список &d(VIP+)&7 &o(максимум 3 друга раз на 7 днів)"
    - "&e/vip rename <текст з #кольорами#>&7 - переназвати предмет у руці &d(VIP+)"
    - "&e/vip nick_color <color>&7 - колір ніку над головою"
    - "&e/vip kit&7 - VIP+ набір раз на 4 дні"
    - "&e/vip pet <назва тваринки>&7 - увімкнути тваринку"
    - "&e/vip pet off&7 - вимкнути тваринку"
    - "&e/vip prefix <текст з #кольорами#>&7 - префікс ніку &o(можна використовувати різні кольори #blue# #red# #green# тощо)"
    - "&e/vip suffix <текст з #кольорами#>&7 - суфікс ніку &o(можна використовувати різні кольори #blue# #red# #green# тощо)"
    - "&e/vip prefix off&7 - вимкнути префікс ніку"
    - "&e/vip suffix off&7 - вимкнути суфікс ніку"
    - "&e/vip chatcolor <#color#>&7 - змінити звичайний колір чату &o(якщо в повідомлені є кольорові теги #red#, #green# та будь-які інші кольори то повідомлення буде з ними, а не зі звичайним кольором)"
    - "&e/vip craft&7 - верстак"
    - "&e/vip ender_chest&7 - ендер скриня"
    - "&e/vip particles <назва анімації>&7 - увімкнути анімації"
    - "&e/vip particles off&7 - вимкнути анімації"
    - "&e/vip join_message <текст з #кольорами#>&7 - зміна кастомного повідомлення при заході на сервер"
    - "&e/vip join_message off&7 - вимкнути кастомне повідомлення при заході на сервер"
    - "&e/vip leave_message <текст з #кольорами#>&7 - зміна кастомного повідомлення при виході з серверу"
    - "&e/vip leave_message off&7 - вимкнути кастомне повідомлення при виході з серверу"
    - "&e/vip kit&7 - отримати VIP+ набір &dVIP+ &o(раз у 4 дні)"
    - "&7Також у гравців VIP та VIP+ є можливість ставити будь-який предмет на голову &o(у слот шолома)"
    - "&7У VIP+ гравців є можливість крафтити невидиме світло"
    - "&7VIP гравці можуть використовувати кольорові теги в чаті: &0#black#&7, &1#dark_blue#&7, &2#dark_green#&7, &3#dark_aqua#&7, &4#dark_red#&7, &5#dark_purple#&7, &6#gold#&7, &7#gray#&7, &8#dark_gray#&7, &9#blue#&7, &a#green#&7, &b#aqua#&7, &c#red#&7, &d#light_purple#&7, &e#yellow#&7, &f#white#&7."
    - "&7Теги форматування: &l#bold#&r&7, &o#italic#&r&7, &n#underline#&r&7, &m#strikethrough#&r&7, #magic#, #reset# та будь-який HEX колір, наприклад #00aaff# &o(HEX кольори можна знайти в інтернеті або на сайті https://htmlcolorcodes.com)"

