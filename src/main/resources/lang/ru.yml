help:
  lines:
    - "&e/vip&7 - сайт покупки / открыть VIP меню"
    - "&e/vip help&7 - подсказки"
    - "&e/vip announcement <текст с #цветами#>&7 - сделать объявление для всех игроков &d(VIP+)&7 &o(1 раз в 15 минут)"
    - "&e/vip addFriend <java/bedrock> <name>&7 - добавить друга в белый список &d(VIP+)&7 &o(максимум 3 друга раз в 7 дней)"
    - "&e/vip rename <текст с #цветами#>&7 - переименовать предмет в руке &d(VIP+)"
    - "&e/vip nick_color <color>&7 - цвет ника над головой"
    - "&e/vip chatcolor <#color#|off>&7 - изменить обычный цвет сообщений в чате"
    - "&e/vip kit&7 - VIP+ набор раз в 4 дня"
    - "&e/vip pet <pet name>&7 - включить питомца"
    - "&e/vip pet off&7 - выключить питомца"
    - "&e/vip prefix <текст с #цветами#>&7 - префикс ника &o(можно использовать разные цвета #blue# #red# #green#)"
    - "&e/vip suffix <текст с #цветами#>&7 - суффикс ника &o(можно использовать разные цвета #blue# #red# #green#)"
    - "&e/vip prefix off&7 - выключить префикс ника"
    - "&e/vip suffix off&7 - выключить суффикс ника"
    - "&e/vip craft&7 - верстак"
    - "&e/vip ender_chest&7 - эндер-сундук"
    - "&e/vip particles <название анимации>&7 - включить анимации"
    - "&e/vip particles off&7 - выключить анимации"
    - "&e/vip join_message <текст с #цветами#>&7 - изменить кастомное сообщение входа"
    - "&e/vip join_message off&7 - выключить кастомное сообщение входа"
    - "&e/vip leave_message <текст с #цветами#>&7 - изменить кастомное сообщение выхода"
    - "&e/vip leave_message off&7 - выключить кастомное сообщение выхода"
    - "&e/vip kit&7 - получить VIP+ набор &dVIP+ &o(раз в 4 дня)"
    - "&7VIP и VIP+ игроки могут надевать любой предмет на голову &o(в слот шлема)"
    - "&7VIP+ игроки могут крафтить невидимый свет"
    - "&7VIP игроки могут использовать цветовые теги в чате: &0#black#&7, &1#dark_blue#&7, &2#dark_green#&7, &3#dark_aqua#&7, &4#dark_red#&7, &5#dark_purple#&7, &6#gold#&7, &7#gray#&7, &8#dark_gray#&7, &9#blue#&7, &a#green#&7, &b#aqua#&7, &c#red#&7, &d#light_purple#&7, &e#yellow#&7, &f#white#&7."
