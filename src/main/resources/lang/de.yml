help:
  lines:
    - "&e/vip&7 - Kauf-Website / VIP-Menü öffnen"
    - "&e/vip help&7 - Hilfe"
    - "&e/vip announcement <Text mit #Farben#>&7 - sende eine Ankündigung an alle Spieler &d(VIP+)&7 &o(einmal alle 15 Minuten)"
    - "&e/vip addFriend <java/bedrock> <name>&7 - füge einen Freund zur Whitelist hinzu &d(VIP+)&7 &o(maximal 3 Freunde alle 7 Tage)"
    - "&e/vip rename <Text mit #Farben#>&7 - benenne den Gegenstand in deiner Hand um &d(VIP+)"
    - "&e/vip nick_color <color>&7 - Nametag-Farbe über dem Kopf"
    - "&e/vip chatcolor <#color#|off>&7 - setze deine Standardfarbe für Chatnachrichten"
    - "&e/vip kit&7 - VIP+ Kit alle 4 Tage"
    - "&e/vip pet <pet name>&7 - aktiviere ein Haustier"
    - "&e/vip pet off&7 - deaktiviere dein Haustier"
    - "&e/vip prefix <Text mit #Farben#>&7 - Nametag-Präfix &o(du kannst Farben wie #blue# #red# #green# verwenden)"
    - "&e/vip suffix <Text mit #Farben#>&7 - Nametag-Suffix &o(du kannst Farben wie #blue# #red# #green# verwenden)"
    - "&e/vip prefix off&7 - deaktiviere dein Nametag-Präfix"
    - "&e/vip suffix off&7 - deaktiviere dein Nametag-Suffix"
    - "&e/vip craft&7 - Werkbank öffnen"
    - "&e/vip ender_chest&7 - Endertruhe öffnen"
    - "&e/vip particles <Animationsname>&7 - Partikel aktivieren"
    - "&e/vip particles off&7 - Partikel deaktivieren"
    - "&e/vip join_message <Text mit #Farben#>&7 - ändere deine eigene Join-Nachricht"
    - "&e/vip join_message off&7 - deaktiviere deine eigene Join-Nachricht"
    - "&e/vip leave_message <Text mit #Farben#>&7 - ändere deine eigene Leave-Nachricht"
    - "&e/vip leave_message off&7 - deaktiviere deine eigene Leave-Nachricht"
    - "&e/vip kit&7 - erhalte das VIP+ Kit &dVIP+ &o(einmal alle 4 Tage)"
    - "&7VIP- und VIP+-Spieler können jeden Gegenstand auf den Kopf setzen &o(in den Helm-Slot)"
    - "&7VIP+-Spieler können unsichtbares Licht craften"
    - "&7VIP-Spieler können Farb-Tags im Chat verwenden: &0#black#&7, &1#dark_blue#&7, &2#dark_green#&7, &3#dark_aqua#&7, &4#dark_red#&7, &5#dark_purple#&7, &6#gold#&7, &7#gray#&7, &8#dark_gray#&7, &9#blue#&7, &a#green#&7, &b#aqua#&7, &c#red#&7, &d#light_purple#&7, &e#yellow#&7, &f#white#&7."
    - "&7Format-Tags: &l#bold#&r&7, &o#italic#&r&7, &n#underline#&r&7, &m#strikethrough#&r&7, #magic#, #reset# und jede HEX-Farbe, z.B. #00aaff# &o(HEX-Farben findest du online oder auf https://htmlcolorcodes.com)"

