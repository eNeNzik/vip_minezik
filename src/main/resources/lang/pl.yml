    - "&e/vip pet off&7 - wyłącz zwierzaka"
    - "&e/vip prefix <tekst z #kolorami#>&7 - prefix nicku &o(możesz używać kolorów #blue# #red# #green#)"
    - "&e/vip suffix <tekst z #kolorami#>&7 - suffix nicku &o(możesz używać kolorów #blue# #red# #green#)"
